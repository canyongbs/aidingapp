info:
  name: Delete Advisory
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/advisories/:advisory"
  params:
    - name: advisory
      value: "{{advisoryId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar('advisoryId', null);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true

docs: |-
  Deletes the advisory. Returns `204 No Content`.

  Uses the `advisoryId` runtime variable, which **Create Advisory** sets automatically. You can also replace the `advisory` path parameter with any advisory ID from **List Advisories**.
