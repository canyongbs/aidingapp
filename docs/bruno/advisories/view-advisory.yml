info:
  name: View Advisory
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/advisories/:advisory"
  params:
    - name: advisory
      value: "{{advisoryId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Shows a single advisory.

  Uses the `advisoryId` runtime variable, which **List Advisories** sets automatically. You can also replace the `advisory` path parameter with any advisory ID from **List Advisories**.
