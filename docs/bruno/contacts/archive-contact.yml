info:
  name: Archive Contact
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/contacts/:contact"
  params:
    - name: contact
      value: "{{contactId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar('contactId', null);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true

docs: |-
  Archives the contact (it is not permanently deleted, but is no longer returned by the API). Returns `204 No Content`. Managed contacts cannot be archived.

  Uses the `contactId` runtime variable, which **Create Contact** sets automatically. You can also replace the `contact` path parameter with any contact ID from **List Contacts**.
