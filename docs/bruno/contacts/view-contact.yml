info:
  name: View Contact
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/contacts/:contact"
  params:
    - name: contact
      value: "{{contactId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Shows a single contact. Archived contacts return `404`.

  Uses the `contactId` runtime variable, which **Create Contact** sets automatically. You can also replace the `contact` path parameter with any contact ID from **List Contacts**.
