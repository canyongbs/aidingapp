info:
  name: List Contacts
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/contacts?page[number]=1&page[size]=30&sort=name"
  params:
    - name: page[number]
      value: "1"
      type: query
      description: Page to return. Defaults to 1.
    - name: page[size]
      value: "30"
      type: query
      description: Results per page. Defaults to 30.
    - name: sort
      value: name
      type: query
      description: One of `name`, `email`, `created_at`. Prefix with `-` for descending.
    - name: filter[name]
      value: Jane
      type: query
      description: Partial match on the full name.
      disabled: true
    - name: filter[email]
      value: example.com
      type: query
      description: Partial match on the email.
      disabled: true
    - name: filter[type]
      value: "{{contactType}}"
      type: query
      description: Exact, case-insensitive contact type name. Separate multiple with `|`.
      disabled: true
    - name: filter[organization]
      value: "{{organizationName}}"
      type: query
      description: Exact, case-insensitive organization name. Separate multiple with `|`.
      disabled: true
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Lists contacts (archived contacts are excluded), paginated with `page[number]` / `page[size]`.

  Enable any of the disabled `filter[...]` query parameters in the **Params** tab to try them.
