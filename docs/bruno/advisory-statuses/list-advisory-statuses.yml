info:
  name: List Advisory Statuses
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/advisory-statuses?page[number]=1&page[size]=30&sort=name"
  params:
    - name: page[number]
      value: "1"
      type: query
      description: Page to return. Defaults to 1.
    - name: page[size]
      value: "30"
      type: query
      description: Results per page. Defaults to 30.
    - name: sort
      value: name
      type: query
      description: One of `name`, `created_at`, `updated_at`. Prefix with `-` for descending.
    - name: filter[name]
      value: Investigating
      type: query
      description: Partial match on the name.
      disabled: true
    - name: filter[classification]
      value: open
      type: query
      description: Either `open` or `resolved`.
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Gives View a record to show when Create has not set one.
        const advisoryStatuses = res.getBody()?.data ?? [];

        if (res.getStatus() === 200 && !bru.getVar('advisoryStatusId') && advisoryStatuses.length) {
          bru.setVar('advisoryStatusId', advisoryStatuses[0].id);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Lists advisory statuses, paginated with `page[number]` / `page[size]`. If the `advisoryStatusId` runtime variable is not set, it is set to the first status returned.

  Enable any of the disabled `filter[...]` query parameters in the **Params** tab to try them.
