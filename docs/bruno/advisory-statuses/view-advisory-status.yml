info:
  name: View Advisory Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/advisory-statuses/:advisoryStatus"
  params:
    - name: advisoryStatus
      value: "{{advisoryStatusId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Shows a single advisory status.

  Uses the `advisoryStatusId` runtime variable, which **List Advisory Statuses** or **Create Advisory Status** sets automatically. You can also replace the `advisoryStatus` path parameter with any advisory status ID from **List Advisory Statuses**.
