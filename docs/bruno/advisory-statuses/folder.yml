docs:
  content: Advisory status endpoints. **Create Advisory Status** sets `advisoryStatusId` / `advisoryStatusName` for the other requests, and **Delete Advisory Status** removes the status it created. These endpoints use the **Settings** permissions, like the admin panel, and require the Advisory Management add-on.
