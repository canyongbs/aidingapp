info:
  name: View Advisory Update
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/v1/advisories/:advisory/updates/:advisoryUpdate"
  params:
    - name: advisory
      value: "{{advisoryId}}"
      type: path
    - name: advisoryUpdate
      value: "{{advisoryUpdateId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

docs: |-
  Shows a single update of the advisory in the `advisoryId` runtime variable. An update requested through a different advisory returns `404`.

  Uses the `advisoryUpdateId` runtime variable, which **List Advisory Updates** or **Create Advisory Update** sets automatically. You can also replace the `advisoryUpdate` path parameter with any update ID from **List Advisory Updates**.
