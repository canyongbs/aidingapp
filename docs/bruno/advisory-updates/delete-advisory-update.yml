info:
  name: Delete Advisory Update
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/api/v1/advisories/:advisory/updates/:advisoryUpdate"
  params:
    - name: advisory
      value: "{{advisoryId}}"
      type: path
    - name: advisoryUpdate
      value: "{{advisoryUpdateId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setVar('advisoryUpdateId', null);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true

docs: |-
  Permanently deletes the advisory update. Returns `204 No Content`.

  Uses the `advisoryUpdateId` runtime variable, which **Create Advisory Update** sets automatically. You can also replace the `advisoryUpdate` path parameter with any update ID from **List Advisory Updates**.
