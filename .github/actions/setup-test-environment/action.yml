name: Set up test environment
description: Starts Redis and PostgreSQL, installs PHP, Composer and npm dependencies, and warms the Laravel caches for running the test suites.

inputs:
    php-version:
        description: PHP version to install.
        required: true
    php-extensions:
        description: PHP extensions to install.
        required: true
    php-extensions-key:
        description: Cache key for the compiled PHP extensions.
        required: true

runs:
    using: composite
    steps:
        - name: Start Redis
          shell: bash
          run: |
              docker run -d \
                --name redis \
                -p 6379:6379 \
                --health-cmd 'redis-cli ping' \
                --health-interval 1s \
                --health-timeout 5s \
                --health-retries 30 \
                redis:7.4@sha256:e9b2e45ecd47fbb69b877cf8d045d5cccaaaed52524b6e098b4abe8212994f73

        - name: Start PostgreSQL
          shell: bash
          run: |
              docker run -d \
                --name postgres \
                -p 5432:5432 \
                -e POSTGRES_DB="${DB_DATABASE}" \
                -e POSTGRES_USER="${DB_USERNAME}" \
                -e POSTGRES_PASSWORD="${DB_PASSWORD}" \
                --tmpfs /var/lib/postgresql/data \
                --health-cmd 'pg_isready -h 127.0.0.1' \
                --health-interval 1s \
                --health-timeout 5s \
                --health-retries 30 \
                postgres:16.8@sha256:301bcb60b8a3ee4ab7e147932723e3abd1cef53516ce5210b39fd9fe5e3602ae \
                -c max_locks_per_transaction=256 \
                -c fsync=off \
                -c synchronous_commit=off \
                -c full_page_writes=off

        - name: Wait for Redis and PostgreSQL
          shell: bash
          run: |
              for container in redis postgres; do
                until docker inspect --format='{{.State.Health.Status}}' "${container}" | grep -q healthy; do
                  sleep 2
                done
              done

        - name: Create tenant database
          shell: bash
          run: PGPASSWORD="${DB_PASSWORD}" psql -h 127.0.0.1 -d "${DB_DATABASE}" -U "${DB_USERNAME}" -c 'CREATE DATABASE testing_tenant;'

        - name: Setup cache environment
          id: extcache
          uses: shivammathur/cache-extensions@22e24453af1bf3851994136f122ce065ab828a74 # 1.15.2
          with:
              php-version: ${{ inputs.php-version }}
              extensions: ${{ inputs.php-extensions }}
              key: ${{ inputs.php-extensions-key }}

        - name: Cache extensions
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ steps.extcache.outputs.dir }}
              key: ${{ runner.os }}-24.04-phpext-${{ inputs.php-version }}-${{ inputs.php-extensions-key }}
              restore-keys: ${{ runner.os }}-24.04-phpext-${{ inputs.php-version }}

        - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
          with:
              php-version: ${{ inputs.php-version }}
              coverage: none
              extensions: ${{ inputs.php-extensions }}

        - name: Copy .env
          shell: bash
          run: php -r "file_exists('.env') || copy('.env.example', '.env');"

        - name: Cache dependencies
          id: cache-composer
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: vendor
              key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock', 'app-modules/**/composer.lock') }}

        - if: ${{ steps.cache-composer.outputs.cache-hit != 'true' }}
          name: Install Dependencies
          shell: bash
          run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

        # Local path-repo packages (e.g. app-modules/**) can add/remove classes without changing
        # composer.lock, leaving a cache hit's autoloader stale. Regenerating is fast and network-free.
        - if: ${{ steps.cache-composer.outputs.cache-hit == 'true' }}
          name: Refresh autoloader for local path repositories
          shell: bash
          run: composer dump-autoload -q --no-ansi --no-interaction --optimize

        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: '.nvmrc'
              cache: 'npm'

        - name: Install npm dependencies
          shell: bash
          run: npm install

        - name: Build Assets
          shell: bash
          run: npm run build

        - name: Generate key
          shell: bash
          run: php artisan key:generate

        - name: Cache Modular Modules
          shell: bash
          run: php artisan modules:cache --env=testing

        - name: Cache Routes
          shell: bash
          run: php artisan route:cache --env=testing

        - name: Cache Views
          shell: bash
          run: php artisan view:cache --env=testing

        - name: Cache Events
          shell: bash
          run: php artisan event:cache --env=testing

        - name: Cache Icons
          shell: bash
          run: php artisan icons:cache --env=testing

        - name: Cache Filament Components
          shell: bash
          run: php artisan filament:cache-components --env=testing

        - name: Check route integrity
          shell: bash
          run: php artisan route:list
